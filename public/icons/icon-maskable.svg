<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Site icon">
  <!--
    Maskable variant. Android crops this into a platform shape (circle, squircle,
    teardrop), keeping only the central 80% safe zone, so the artwork is inset and
    the background bleeds to the full canvas.
  -->
  <rect width="64" height="64" fill="#000000" />
  <path d="M32 16 48 32 32 48 16 32Z" fill="none" stroke="#f5f5f7" stroke-width="2" stroke-linejoin="round" opacity="0.35" />
  <path d="M32 24 40 32 32 40 24 32Z" fill="#f5f5f7" />
</svg>
